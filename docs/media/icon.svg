<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Showerboard">
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#16181D"/>
  <!-- Tactile accent button on left wall -->
  <rect x="17" y="54" width="9" height="20" rx="4" fill="#E05A2B"/>
  <!-- Warm stone enclosure bezel -->
  <rect x="24" y="34" width="84" height="60" rx="10" fill="#ECE9E2"/>
  <!-- High-contrast e-Paper window -->
  <rect x="33" y="42" width="66" height="44" rx="4" fill="#16181D"/>
  <!-- Clock row (largest visual element) -->
  <rect x="39" y="48" width="32" height="12" rx="2" fill="#F2F3F5"/>
  <!-- Weather / battery corner -->
  <rect x="78" y="48" width="15" height="4" rx="1.5" fill="#9AA2B1"/>
  <rect x="78" y="55" width="15" height="5" rx="1.5" fill="#9AA2B1"/>
  <!-- Departure rows -->
  <rect x="39" y="65" width="12" height="6" rx="1.5" fill="#E05A2B"/>
  <rect x="55" y="65" width="38" height="6" rx="1.5" fill="#F2F3F5"/>
  <rect x="39" y="75" width="12" height="6" rx="1.5" fill="#F2F3F5"/>
  <rect x="55" y="75" width="26" height="6" rx="1.5" fill="#9AA2B1"/>
</svg>
